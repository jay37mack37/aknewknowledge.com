(()=>{'use strict';const $=id=>document.getElementById(id),key='aknewcomic.issue01.page.v2';let pages=[],i=0,startX=null,startY=null;const status=t=>{$('status').textContent=t;$('status').hidden=false;$('art').hidden=true};function show(n){i=Math.max(0,Math.min(pages.length-1,n));const p=pages[i];if(!p)return;$('page').src=p.src;$('page').alt=p.label;$('art').setAttribute('aria-label','Enlarge '+p.label);$('count').textContent=i===0?'Cover':`${i} / ${pages.length-1}`;$('prev').disabled=i===0;$('next').disabled=i===pages.length-1;$('next').textContent=i===0?'Read issue →':'Next →';document.querySelectorAll('#thumbs button').forEach((b,j)=>b.setAttribute('aria-current',String(i===j)));try{localStorage.setItem(key,String(i))}catch{}if(pages[i+1]){const preload=new Image();preload.src=pages[i+1].src}}
$('page').onload=()=>{$('status').hidden=true;$('art').hidden=false};$('page').onerror=()=>status('This page could not load. Please reload, or download the issue.');$('prev').onclick=()=>show(i-1);$('next').onclick=()=>show(i+1);$('overview').onclick=()=>{const open=$('thumbs').hidden;$('thumbs').hidden=!open;document.body.classList.toggle('overview',open);$('overview').setAttribute('aria-expanded',String(open))};$('art').onclick=()=>{const p=pages[i];$('zpage').src=p.src;$('zpage').alt=p.label;$('zlabel').textContent=p.label;$('zscroll').classList.remove('actual');$('fit').textContent='Actual size';$('zoom').showModal()};const toggle=()=>{const actual=$('zscroll').classList.toggle('actual');$('fit').textContent=actual?'Fit page':'Actual size'};$('fit').onclick=toggle;$('zpage').onclick=toggle;$('close').onclick=()=>{$('zoom').close();$('art').focus()};document.addEventListener('keydown',e=>{if($('zoom').open||e.altKey||e.ctrlKey||e.metaKey||['SELECT','INPUT'].includes(e.target.tagName))return;if(e.key==='ArrowRight'){e.preventDefault();show(i+1)}if(e.key==='ArrowLeft'){e.preventDefault();show(i-1)}});$('stage').addEventListener('touchstart',e=>{if(e.touches.length!==1){startX=null;return}startX=e.touches[0].clientX;startY=e.touches[0].clientY},{passive:true});$('stage').addEventListener('touchend',e=>{if(startX===null||!e.changedTouches.length)return;const dx=e.changedTouches[0].clientX-startX,dy=e.changedTouches[0].clientY-startY;startX=null;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.6)show(i+(dx<0?1:-1))},{passive:true});async function boot(){try{const res=await fetch('issue.json',{cache:'no-cache'});if(!res.ok)throw Error();const m=await res.json();if(!Array.isArray(m.pages)||!m.pages.length)throw Error();pages=m.pages;for(const p of pages){if(!/^pages\/[a-z0-9-]+\.(webp|jpg|png)$/.test(p.src)||typeof p.label!=='string')throw Error()}$('pdf').href='issue-01.pdf';pages.forEach((p,n)=>{const b=document.createElement('button');b.setAttribute('aria-label','Show
